<h1>Khám phá tính cách</h1>

Chọn phương án gần với bạn nhất. Kết quả chỉ mang tính tham khảo.

<div class="actions">

    Lưu & tiếp tục →
  </button>

<script src="main.js"></script>

<script>

const qs = [

[
  'Khi gặp một bài toán khó, bạn thường...',
  [
    'Tìm cách giải từng bước',
    'Hỏi người khác',
    'Thử một cách hoàn toàn mới',
    'Tạm bỏ qua'
  ]
],

[
  'Khi làm việc nhóm, bạn thường...',
  [
    'Phân tích nhiệm vụ',
    'Kết nối mọi người',
    'Đưa ra ý tưởng',
    'Hỗ trợ phía sau'
  ]
],

[
  'Bạn thích công việc nào hơn?',
  [
    'Làm việc với dữ liệu',
    'Làm việc với con người',
    'Tạo ra sản phẩm mới',
    'Giúp đỡ người khác'
  ]
],

[
  'Khi có một vấn đề mới, bạn thường...',
  [
    'Tìm thông tin và phân tích',
    'Trao đổi với người khác',
    'Thử nghiệm ngay',
    'Quan sát trước'
  ]
],

[
  'Bạn cảm thấy hứng thú nhất khi...',
  [
    'Tìm ra quy luật',
    'Thuyết phục người khác',
    'Sáng tạo thứ chưa có',
    'Hoàn thành việc khó'
  ]
],

[
  'Bạn thích môi trường...',
  [
    'Có hệ thống rõ ràng',
    'Nhiều giao tiếp',
    'Tự do sáng tạo',
    'Ổn định và hỗ trợ'
  ]
],

[
  'Khi thất bại, bạn thường...',
  [
    'Phân tích nguyên nhân',
    'Chia sẻ với người khác',
    'Tìm cách khác',
    'Kiên trì làm lại'
  ]
],

[
  'Bạn muốn được đánh giá cao vì...',
  [
    'Khả năng tư duy',
    'Khả năng giao tiếp',
    'Sự sáng tạo',
    'Sự đáng tin cậy'
  ]
]

];

const old = read('personalityAnswers') || [];

const box = document.getElementById('questions');

qs.forEach((q, i) => {

  let h = `
    <div class="question">
      <h3>${i + 1}. ${q[0]}</h3>
  `;

  q[1].forEach((a, j) => {

    h += `
      <label class="radio">
        <input
          type="radio"
          name="q${i}"
          value="${j}"
          ${old[i] == j ? 'checked' : ''}
        >
        ${a}
      </label>
    `;

  });

  h += `</div>`;

  box.innerHTML += h;

});


function finish() {

  const ans = [];

  for (let i = 0; i < qs.length; i++) {

    const x = document.querySelector(
      `input[name=q${i}]:checked`
    );

    if (!x) {

      alert('Hãy trả lời tất cả câu hỏi.');

      return;
    }

    ans.push(Number(x.value));

  }

  save('personalityAnswers', ans);

  location.href = 'muc-tieu.html';

}

</script>
