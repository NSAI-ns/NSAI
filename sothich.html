<p class="eyebrow">BƯỚC 3</p>

<h1>Sở thích</h1>

<p class="muted">
Chọn những lĩnh vực bạn thích và mô tả thêm nếu muốn.
</p>


<div id="chips" class="chips"></div>


<label>

Sở thích khác

<textarea
id="custom"
rows="5"
placeholder="Ví dụ: lập trình, nghiên cứu, kinh doanh..."></textarea>

</label>


<div class="actions">

<button
class="btn primary"
onclick="saveHobbies()">

Lưu & tiếp tục →

</button>

</div>

</section>

</main>


<script src="main.js"></script>


<script>

const hobbies = [

'💻 Công nghệ',
'🔬 Khoa học',
'🧮 Toán học',
'🎨 Nghệ thuật',
'💼 Kinh doanh',
'🗣️ Giao tiếp',
'⚽ Thể thao',
'📚 Đọc sách',
'🌱 Môi trường',
'🔧 Kỹ thuật',
'🎮 Game',
'✍️ Viết lách'

];


const old = read('hobbies') || {

selected: [],

custom: ''

};


const c = document.getElementById('chips');


hobbies.forEach(h => {

const b = document.createElement('button');

b.className =
'chip ' +
(old.selected.includes(h) ? 'selected' : '');

b.textContent = h;


b.onclick = () => {

b.classList.toggle('selected');

};


c.appendChild(b);

});


document.getElementById('custom').value =
old.custom || '';


function saveHobbies(){

save('hobbies', {

selected: [
...document.querySelectorAll('.chip.selected')
].map(x => x.textContent),

custom:
document.getElementById('custom').value

});


location.href = 'tinhcach.html';

}

</script>

</body>
