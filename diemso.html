<h1>Điểm các môn</h1>

<p class="muted">
Môn không học hoặc chưa có điểm có thể để trống.
Điểm trống sẽ không được tính.
</p>


<div id="scores" class="score-grid"></div>


<div class="actions">

<button
class="btn primary"
onclick="saveScores()">

Lưu & tiếp tục →

</button>

</div>

</section>

<!-- ĐÃ SỬA -->
<script src="main.js"></script>


<script>

const subjects = [

'Toán',
'Vật lý',
'Hóa học',
'Sinh học',
'Tin học',
'Ngữ văn',
'Tiếng Anh',
'Lịch sử',
'Địa lý',
'GDKT&PL'

];


const old = read('scores') || {};

const box = document.getElementById('scores');


subjects.forEach((s,i) => {

const key = 's' + i;

box.innerHTML += `

<label>

${s}

<input
id="${key}"
type="number"
min="0"
max="10"
step="0.1"
placeholder="Để trống nếu không học"
value="${old[s] ?? ''}">

</label>

`;

});


function saveScores(){

const d = {};

subjects.forEach((s,i) => {

let v =
document.getElementById('s'+i).value;

if(v !== '')
d[s] = Number(v);

});


save('scores',d);

location.href = 'sothich.html';

}

</script>

</body>
